version: '3.8'

services:
  apex-eams:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apex_eams_platform
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # WAJIB di production: rahasia penanda tanda tangan sesi (min. 16 karakter, acak & panjang).
      - SESSION_SECRET=${SESSION_SECRET:?isi SESSION_SECRET di file .env}
      # Password awal akun bawaan (wajib diganti saat login pertama). Kosongkan = dibuat acak & dicetak di log.
      - SEED_PASSWORD=${SEED_PASSWORD:-}
      - DEMO_MODE=${DEMO_MODE:-false}
      # Bila di belakang reverse proxy (nginx/Traefik/Cloudflare), set true agar pembatas login memakai IP asli.
      - TRUST_PROXY=${TRUST_PROXY:-false}
    volumes:
      - eams_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  eams_data:
    driver: local
